services:
  redis:
    image: redis:7.4-alpine
    container_name: apex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - apex-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: apex-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: apex123
      MYSQL_DATABASE: apex
      TZ: Asia/Shanghai
    volumes:
      - apex-mysql-data:/var/lib/mysql
      - ./apex-be/docs/sql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-papex123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  apex-redis-data:
  apex-mysql-data:

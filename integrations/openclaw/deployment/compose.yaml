services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-registry.cn-hangzhou.aliyuncs.com/awe-images/openclaw:2026.7.1-2}
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: ${TZ:-Asia/Shanghai}
      APEX_BOT_BASE_URL: ${APEX_BOT_BASE_URL:-https://apex.aweew.com}
      APEX_BOT_CLIENT_KEY: ${APEX_BOT_CLIENT_KEY:?Set APEX_BOT_CLIENT_KEY}
      APEX_BOT_CLIENT_SECRET: ${APEX_BOT_CLIENT_SECRET:?Set APEX_BOT_CLIENT_SECRET}
    volumes:
      - ./data/state:/home/node/.openclaw
      - ./data/workspace:/home/node/.openclaw/workspace
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-registry.cn-hangzhou.aliyuncs.com/awe-images/openclaw:2026.7.1-2}
    profiles:
      - tools
    network_mode: service:openclaw-gateway
    init: true
    stdin_open: true
    tty: true
    depends_on:
      - openclaw-gateway
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN}
      TZ: ${TZ:-Asia/Shanghai}
      APEX_BOT_BASE_URL: ${APEX_BOT_BASE_URL:-https://apex.aweew.com}
      APEX_BOT_CLIENT_KEY: ${APEX_BOT_CLIENT_KEY:?Set APEX_BOT_CLIENT_KEY}
      APEX_BOT_CLIENT_SECRET: ${APEX_BOT_CLIENT_SECRET:?Set APEX_BOT_CLIENT_SECRET}
    volumes:
      - ./data/state:/home/node/.openclaw
      - ./data/workspace:/home/node/.openclaw/workspace
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - node
      - dist/index.js

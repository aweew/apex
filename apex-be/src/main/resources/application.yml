# 服务配置
server:
  port: 8080
  servlet:
    context-path: /apex

# spring 配置
spring:
  application:
    name: apex
  profiles:
    active: local
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    hikari:
      maximum-pool-size: 20
      idle-timeout: 10000
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  data:
    redis:
      connect-timeout: 1500ms
      timeout: 1500ms

# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.awe.apex.manager.domain,com.awe.apex.quant.domain
  global-config:
    dbConfig:
      idType: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Swagger3 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    use-root-path: true
  cache:
    disabled: true

# 日志
logging:
  level:
    org.springframework: warn
    com.awe: info
    com.awe.apex.common.log.P6SpySlf4JLogger: warn
  config: classpath:logback-spring.xml

# 全局线程池相关配置
thread-pool:
  enabled: true
  queueCapacity: 128
  keepAliveSeconds: 300

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  jwt-secret-key: rtFDdiyVAjM8EYqwNgbS
  is-log: true

# Apex 业务配置
apex:
  mx-output-dir: ${user.dir}/../../.mx_output
  local-username: admin
  local-password: admin123
  hot:
    python-cmd: python
    # IDEA 工作目录通常为 apex-be，相对仓库根为 ../scripts
    script-path: ${user.dir}/../scripts/market_data/sync_hot.py
  news:
    python-cmd: python
    script-path: ${user.dir}/../scripts/market_data/sync_news.py
  # 大模型（Key 放 application-local.yml，勿入库）
  ai:
    enabled: true
    base-url: https://api.moonshot.cn/v1
    api-key: ${APEX_AI_API_KEY:}
    model: kimi-k2.6
    timeout-ms: 45000
    summary-cache-seconds: 600
  # 微信 ClawBot / OpenClaw 接入，生产环境通过环境变量开启
  bot:
    enabled: ${APEX_BOT_ENABLED:false}
    client-key: ${APEX_BOT_CLIENT_KEY:}
    client-secret: ${APEX_BOT_CLIENT_SECRET:}
    timestamp-tolerance-seconds: ${APEX_BOT_TIMESTAMP_TOLERANCE_SECONDS:300}
    notification-cooldown-seconds: ${APEX_BOT_NOTIFICATION_COOLDOWN_SECONDS:1800}
    mover-threshold: ${APEX_BOT_MOVER_THRESHOLD:5}
    watchlist-group: ${APEX_BOT_WATCHLIST_GROUP:我的自选}
    morning-briefing:
      enabled: ${APEX_BOT_MORNING_BRIEFING_ENABLED:true}
      symbols: ${APEX_BOT_MORNING_BRIEFING_SYMBOLS:usIXIC,usDJI,usINX,usNVDA,usAAPL,usTSLA,usBABA,usPDD}
    weclaw:
      enabled: ${APEX_BOT_WECLAW_ENABLED:false}
      base-url: ${APEX_BOT_WECLAW_BASE_URL:}
      recipient: ${APEX_BOT_WECLAW_RECIPIENT:}
      api-token: ${APEX_BOT_WECLAW_API_TOKEN:}
      timeout-ms: ${APEX_BOT_WECLAW_TIMEOUT_MS:5000}
  index:
    python-cmd: python
    script-path: ${user.dir}/../scripts/market_data/sync_index.py
  sector:
    python-cmd: python
    script-path: ${user.dir}/../scripts/market_data/sync_sector.py
  sync:
    python-cmd: python
    script-dir: ${user.dir}/../scripts/market_data
